# ============================================================
# ECOSORT AI CONFIGURATION
# ============================================================

project.name=EcoSort AI
project.version=1.0
project.domain=Circular Economy

# ============================================================
# REPRODUCIBILITY
# ============================================================

random.seed=42

# ============================================================
# MATERIAL CLASSES
# ============================================================

class.count=4

class.0=PLASTIC
class.1=METAL
class.2=GLASS
class.3=PAPER_CARDBOARD

# ============================================================
# DATASET
# ============================================================

dataset.total.images=1407

dataset.train.images=976
dataset.validation.images=212
dataset.test.images=219

dataset.segmentation.objects=3414

# ============================================================
# DETECTION
# ============================================================

detector.input.size=960
detector.confidence.threshold=0.25

# Final stable model path.
# The winning experiment weight will be copied here later.

detector.model=weights/final_detector_best.pt

# ============================================================
# SEGMENTATION
# ============================================================

segmentation.input.size=960
segmentation.confidence.threshold=0.25

segmentation.model=weights/ecosort_segmentation_best.pt

# ============================================================
# OUTPUT
# ============================================================

detection.output=results/inference

segmentation.output=results/segmentation_inference

history.output=results/history

# ============================================================
# APPLICATION
# ============================================================

application.name=EcoSort AI
application.mode=desktop

manual.review.enabled=true